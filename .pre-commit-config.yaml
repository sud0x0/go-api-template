repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # asvs-5.0.0.txt is a verbatim `pdftotext -layout` extraction of the ASVS
      # PDF; it carries page-break form-feed bytes and no final newline. Exclude
      # it from the whitespace-rewriting hooks so they don't mutate a generated,
      # licensed artifact (it stays reproducible from a fresh extraction).
      # gitleaks and check-added-large-files still scan it.
      - id: trailing-whitespace
        exclude: '^\.claude/skills/security-review/references/asvs-5\.0\.0\.txt$'
      - id: end-of-file-fixer
        exclude: '^\.claude/skills/security-review/references/asvs-5\.0\.0\.txt$'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Go formatting and linting
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        files: \.go$

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        files: \.go$
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        files: go\.(mod|sum)$
        pass_filenames: false

  # Semgrep security scan
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.156.0
    hooks:
      - id: semgrep
        args:
          # Pinned rulesets instead of --config=auto. `auto` pulls whatever the
          # semgrep registry serves at scan time, so a passing pipeline can
          # start failing with no code change when upstream adds rules. These
          # named configs cover this repo's surface (Go + GitHub Actions) and
          # only run rules we've chosen, so the rule set no longer drifts.
          - --config=p/golang
          - --config=p/github-actions
          # These two supply-chain rules are NOT in p/github-actions; pin them
          # explicitly so we keep enforcing SHA-pinned actions and no curl|sh.
          - --config=r/yaml.github-actions.security.github-actions-mutable-action-tag
          - --config=r/yaml.github-actions.security.gha-curl-pipe-shell
          - --error
          - --skip-unknown-extensions
